# Render Blueprint — deploys frontend + backend as ONE service with ONE URL.
# Commit this file, push to GitHub, then in Render: New → Blueprint → pick
# this repo. Render reads this file and creates the service automatically.
#
# Runtime: Python (FastAPI) serving the static Frontend/ folder from the same
# process — no Node build, no separate static host, no CORS setup needed.

services:
  - type: web
    name: sage-app
    runtime: python
    plan: free
    rootDir: backend
    # Install deps, then bake the bundled burn-in dataset into the image so
    # the deployed app serves real ML data (not the mock fallback).
    # Ingestion is idempotent; takes ~1-3 min on the free tier.
    buildCommand: pip install -r requirements.txt && python -m database ingest data/burn_in_dataset.csv --init
    # $PORT is injected by Render; the frontend folder sits one level up
    # (repo root), which app/main.py auto-detects.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.6
      # SQLite lives inside the build image. Because the ingest runs at build
      # time, the populated DB ships with each deploy (free plan has no
      # persistent disk: user CSV uploads are ephemeral, the baked dataset is not).
      - key: DATABASE_URL
        value: sqlite:////opt/render/project/src/backend/astra_guard.db
      # --- JWT auth (app/core/security.py) — set these in the Render
      # dashboard, NOT here, so the secret never lands in this committed file:
      #   SAGE_JWT_SECRET   (python -c "import secrets; print(secrets.token_urlsafe(48))")
      #   SAGE_ACCESS_TOKEN_EXPIRE_MINUTES (optional, default 480 = 8 h)
      # Users/roles now live in the DB (seeded: admin/engineer/reviewer),
      # so SAGE_AUTH_USERNAME / SAGE_AUTH_PASSWORD are no longer used.
      - key: SAGE_JWT_SECRET
        sync: false
