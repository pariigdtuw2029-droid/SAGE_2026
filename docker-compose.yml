services:
  sage-app:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Same-origin deployment — no cross-origin setup needed
      - ALLOWED_ORIGINS=http://localhost:8000,http://127.0.0.1:8000
      # SQLite inside the container; mount a volume to persist it
      - DATABASE_URL=sqlite:////app/backend/backend/astra_guard.db
      # JWT auth — override via a .env file next to docker-compose.yml or
      # an export; do NOT bake real credentials into this committed file.
      # Generate a secret: python -c "import secrets; print(secrets.token_urlsafe(48))"
      - SAGE_JWT_SECRET=${SAGE_JWT_SECRET:?Set SAGE_JWT_SECRET in your shell or .env}
      # Users/roles live in the DB (seeded: admin/engineer/reviewer, all 'sage2026').
      # SAGE_AUTH_USERNAME / SAGE_AUTH_PASSWORD are no longer read by the app.
    volumes:
      - sage_db:/app/backend/backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  sage_db:
