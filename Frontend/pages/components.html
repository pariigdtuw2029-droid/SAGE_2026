<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Component Database — SAGE</title>
<link rel="icon" href="../assets/brand/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared.css" />
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="console">
    <div class="console-top" id="consoleTop"></div>

    <!-- Group 3: Component Deep-Dive & Predictions Sub-Navigation Ribbon -->
    <!-- Task-Oriented Navigation Ribbon -->
    <nav class="subnav-bar">
      <span class="subnav-badge">04 // Component Database</span>
      <a class="subnav-tab active" href="components.html">01 Component Screening Database</a>
      <a class="subnav-tab" href="component-detail.html">02 Component Inspector &amp; Diagnostics →</a>
      <a class="subnav-tab" href="lot-analytics.html">← Lot Overview</a>
      <a class="subnav-tab" href="reports.html">Inspection Reports →</a>
    </nav>

    <div class="console-actions" style="margin-bottom:18px;">
      <input class="input" id="q" placeholder="Search component ID…" style="min-width:220px;" />
      <select class="select" id="fLot"><option value="">All Lots</option></select>
      <select class="select" id="fDec">
        <option value="">All Status</option>
        <option>PASS</option><option>MONITOR</option><option>HOLD</option><option>REJECT</option>
      </select>
      <button class="btn ghost" id="clear">Clear</button>
      <span class="box-sub" id="count" style="margin:0 0 0 auto;"></span>
    </div>

    <section class="box">
      <div class="table-wrap">
        <table class="data" id="compTable">
          <thead>
            <tr><th>Component ID</th><th>Lot Identifier</th><th>Anomaly Score</th><th>Predicted @168h</th><th>Risk Score</th><th>Decision</th><th>Reliability Tier</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>
</div>

<script src="../api.js"></script>
<script src="../auth.js"></script>
<script src="../app.js"></script>
<script>
  const { topbar, renderSidebar, badge } = window.SAGE;

  renderSidebar("components.html");
  topbar("Component Database", null, null, `<span class="box-sub" style="margin:0;">Verified Component Screening</span>`);

  const lotsSel = document.getElementById("fLot");
  const qInput = document.getElementById("q");
  const decSel = document.getElementById("fDec");
  const clearBtn = document.getElementById("clear");
  const countEl = document.getElementById("count");
  const tbody = document.querySelector("#compTable tbody");

  let currentComps = [];
  let isLoading = false;
  let loadError = null;

  // Populate lot dropdown with real database lots
  async function loadLots() {
    const res = await window.SAGEAPI.getLots();
    const lots = (res.data && Array.isArray(res.data.value)) ? res.data.value : (Array.isArray(res.data) ? res.data : null);
    if (res.ok && lots) {
      for (const l of lots) {
        const o = document.createElement("option");
        o.value = l.lot_id;
        o.textContent = l.lot_id;
        lotsSel.appendChild(o);
      }
    } else {
      loadError = "Failed to load lots from backend.";
      render();
    }
  }

  // Fetch components when a real lot is selected
  async function onLotChange() {
    const lotId = lotsSel.value;
    loadError = null;

    if (!lotId) {
      currentComps = [];
      isLoading = false;
      render();
      return;
    }

    isLoading = true;
    currentComps = [];
    render();

    const res = await window.SAGEAPI.getLotComponents(lotId);
    isLoading = false;

    const comps = (res.data && Array.isArray(res.data.value)) ? res.data.value : (Array.isArray(res.data) ? res.data : null);
    if (res.ok && comps) {
      currentComps = comps;
    } else {
      currentComps = [];
      loadError = res.error || "Failed to load components for lot.";
    }
    render();
  }

  function render() {
    const lotId = lotsSel.value;
    const q = qInput.value.trim().toUpperCase();
    const dec = decSel.value;

    if (!lotId) {
      countEl.textContent = "Select a lot";
      tbody.innerHTML = `<tr><td colspan="7" style="color:var(--steel); padding: 36px 16px; text-align: center;"><div style="font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:0.08em;color:var(--sky);margin-bottom:6px;text-transform:uppercase;">No Lot Selected</div><p style="color:var(--steel-dim);font-size:12px;margin:0;">Select a production lot from the dropdown above to inspect component telemetry.</p></td></tr>`;
      return;
    }

    if (isLoading) {
      countEl.textContent = "Loading…";
      tbody.innerHTML = `<tr><td colspan="7" style="color:var(--steel); padding: 36px 16px; text-align: center;"><div class="pulse-spinner"></div><div style="font-family:var(--mono);font-size:12px;color:var(--steel);">Loading lot components from screening repository…</div></td></tr>`;
      return;
    }

    if (loadError) {
      countEl.textContent = "Error";
      tbody.innerHTML = `<tr><td colspan="7" style="color:var(--reject); padding: 36px 16px; text-align: center;"><div style="font-family:var(--mono);font-size:13px;font-weight:600;margin-bottom:6px;">DATA RETRIEVAL FAILED</div><div style="font-size:12px;color:var(--steel-dim);">${loadError}</div></td></tr>`;
      return;
    }

    if (currentComps.length === 0) {
      countEl.textContent = "0 components";
      tbody.innerHTML = `<tr><td colspan="7" style="color:var(--steel-dim); padding: 36px 16px; text-align: center;">No components found for this lot.</td></tr>`;
      return;
    }

    const rows = currentComps.filter((c) => {
      const compId = (c.component_id || "").toUpperCase();
      const compDec = (c.decision || "").toUpperCase();
      const matchQ = !q || compId.includes(q);
      const matchDec = !dec || compDec === dec;
      return matchQ && matchDec;
    });

    countEl.textContent = `${rows.length} component${rows.length === 1 ? "" : "s"}`;

    if (rows.length === 0) {
      tbody.innerHTML = `<tr><td colspan="7" style="color:var(--steel-dim); padding: 24px; text-align: center;">No components match the active filter criteria.</td></tr>`;
      return;
    }

    tbody.innerHTML = rows.slice(0, 150).map((c) => {
      const compId = c.component_id || "—";
      const lot = c.lot_id || lotId;
      const anomaly = typeof c.anomaly_score === "number" ? c.anomaly_score.toFixed(1) : (c.anomaly_score || "—");
      const drift = typeof c.predicted_168h === "number" ? `${c.predicted_168h.toFixed(3)} µA` : (c.predicted_168h || "—");
      const risk = typeof c.risk_score === "number" ? c.risk_score.toFixed(1) : (c.risk_score || "—");
      const decision = c.decision || "—";
      const tier = c.reliability_tier || (typeof c.risk_score === "number" ? (c.risk_score >= 65 ? "High-Risk" : c.risk_score >= 21.8 ? "Borderline" : "Space-Safe") : "—");
      const tierClass = tier === "Space-Safe" ? "safe" : tier === "High-Risk" ? "reject" : "monitor";

      return `
        <tr class="click" data-c="${compId}" data-lot="${lot}">
          <td style="font-weight:600;color:var(--signal);">${compId}</td>
          <td style="color:var(--steel);">${lot}</td>
          <td>${anomaly}</td>
          <td style="color:var(--gold);">${drift}</td>
          <td>${risk}</td>
          <td>${badge(decision)}</td>
          <td><span class="badge ${tierClass}">${tier}</span></td>
        </tr>`;
    }).join("");

    if (rows.length > 150) {
      tbody.insertAdjacentHTML("beforeend",
        `<tr><td colspan="7" style="color:var(--steel-dim); padding: 12px; text-align: center;">…and ${(rows.length - 150).toLocaleString()} more — refine the search</td></tr>`);
    }
  }

  lotsSel.addEventListener("change", onLotChange);
  qInput.addEventListener("input", render);
  decSel.addEventListener("change", render);

  clearBtn.addEventListener("click", () => {
    qInput.value = "";
    decSel.value = "";
    lotsSel.value = "";
    onLotChange();
  });

  tbody.addEventListener("click", (e) => {
    const tr = e.target.closest("tr.click");
    if (tr && tr.dataset.c) {
      location.href = `component-detail.html?comp=${encodeURIComponent(tr.dataset.c)}&lot=${encodeURIComponent(tr.dataset.lot)}`;
    }
  });

  loadLots();
  render();
</script>
</body>
</html>
