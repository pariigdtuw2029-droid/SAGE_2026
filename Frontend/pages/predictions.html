<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Redirecting to Component Inspector — SAGE</title>
<link rel="icon" href="../assets/brand/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared.css" />
<script>
  (function() {
    const params = new URLSearchParams(window.location.search);
    const comp = params.get("comp") || params.get("id") || "";
    const lot = params.get("lot") || "";
    const target = new URL("component-detail.html", window.location.href);
    if (comp) target.searchParams.set("comp", comp);
    if (lot) target.searchParams.set("lot", lot);
    window.location.replace(target.toString());
  })();
</script>
<noscript>
  <meta http-equiv="refresh" content="0; url=component-detail.html" />
</noscript>
</head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg);color:var(--text);font-family:var(--sans);margin:0;padding:24px;">
  <div style="background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:36px;max-width:480px;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,0.4);">
    <div style="font-family:var(--mono);font-size:12px;letter-spacing:0.08em;color:var(--sky);text-transform:uppercase;margin-bottom:12px;">SAGE // Consolidation Notice</div>
    <h2 style="font-family:var(--head);font-size:20px;color:var(--frost);margin:0 0 12px;">Redirecting to Component Inspector</h2>
    <p style="font-family:var(--mono);font-size:12px;color:var(--steel);line-height:1.6;margin-bottom:20px;">
      AI Predictions, Conformal Forecasts, and Trajectory Telemetry have been consolidated into the unified <strong>Component Inspector</strong>.
    </p>
    <a id="redirectLink" href="component-detail.html" class="btn" style="text-decoration:none;">Go to Component Inspector →</a>
  </div>
  <script>
    const p = new URLSearchParams(window.location.search);
    const c = p.get("comp") || p.get("id") || "";
    const l = p.get("lot") || "";
    const link = document.getElementById("redirectLink");
    if (link) {
      const u = new URL("component-detail.html", window.location.href);
      if (c) u.searchParams.set("comp", c);
      if (l) u.searchParams.set("lot", l);
      link.href = u.toString();
    }
  </script>
</body>
</html>
