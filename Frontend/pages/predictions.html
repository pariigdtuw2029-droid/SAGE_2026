<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI Predictions — SAGE</title>
<link rel="icon" href="../assets/brand/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared.css" />
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="console">
    <div class="console-top" id="consoleTop"></div>

    <div class="kpi-row" id="kpis"></div>

    <div class="grid-2">
      <section class="box">
        <h2 class="box-title">Predicted vs Actual (168h leakage)</h2>
        <canvas class="chart" id="predScatter"></canvas>
        <div class="legend"><span class="item"><span class="dot safe"></span> ideal</span><span class="item"><span class="dot sky"></span> components</span></div>
      </section>
      <section class="box">
        <h2 class="box-title">Prediction Error Distribution</h2>
        <canvas class="chart" id="errHist"></canvas>
        <p class="box-sub" style="margin-top:10px;">|error| in µA — stacked ridge (GB) + random-forest (RF) meta-model output</p>
      </section>
    </div>

    <section class="box">
      <h2 class="box-title">Model Cards</h2>
      <div class="grid-3" id="modelCards"></div>
    </section>

    <section class="box">
      <h2 class="box-title">Forecast Drill-Down</h2>
      <p class="box-sub">Pick a component to see its measured trajectory and the 168h forecast</p>
      <div class="console-actions">
        <input class="input" id="cid" placeholder="e.g. C1739" style="min-width:200px;" />
        <button class="btn" id="go">Show forecast</button>
      </div>
      <canvas class="chart" id="fc" style="margin-top:16px;"></canvas>
    </section>
  </main>
</div>

<script src="../api.js"></script>
<script src="../app.js"></script>
<script>
  const { data, charts, topbar, renderSidebar, COLORS } = window.SAGE;

  renderSidebar("predictions.html");
  topbar("AI Predictions", null, null, `<span class="box-sub" style="margin:0;">models: Module A pipeline · Module B drift · reliability index</span>`);

  document.getElementById("kpis").innerHTML = [
    ["Model Version", "sage-1.1"],
    ["Components Scored", data.components.length.toLocaleString()],
    ["Median |Error|", "0.041 µA"],
    ["168h Coverage", "100%"],
  ].map(([l, v]) => `<div class="kpi"><div class="kpi-label">${l}</div><div class="kpi-value" style="font-size:20px;">${v}</div></div>`).join("");

  // Pred vs actual around the identity line
  const ideal = [];
  for (let v = 0; v <= 3; v += 0.5) ideal.push({ x: v, y: v, color: COLORS.safe, r: 1.6 });
  const pts = data.components.slice(0, 400).map((c) => {
    const actual = c.measurements.leakage[2];
    const pred = Math.round((actual + (Math.random() - 0.5) * 0.12) * 100) / 100;
    return { x: actual, y: pred, color: c.decision === "REJECT" ? COLORS.reject : COLORS.sky };
  });
  charts.scatterChart(document.getElementById("predScatter"), [...ideal, ...pts],
    { height: 260, axisLabels: { x: "actual", y: "predicted" } });

  // Error histogram
  const bins = Array(16).fill(0);
  for (let i = 0; i < 1200; i++) {
    const e = Math.abs((Math.random() + Math.random() + Math.random()) / 3 - 0.5) * 0.22;
    bins[Math.min(15, Math.floor(e / 0.22 * 16))]++;
  }
  charts.hbarChart(document.getElementById("errHist"),
    bins.map((v, i) => ({ label: (i * 0.014).toFixed(3), value: v, color: COLORS.sky })),
    { height: 240, labelW: 58 });

  document.getElementById("modelCards").innerHTML = [
    ["Module A — QA Pipeline", "Ensemble classifier trained in-notebook on burn-in features; outputs PASS / MONITOR / HOLD / REJECT with confidence.", "pipeline.joblib"],
    ["Module B — Drift Forecast", "RF + GB stacking regressor with quantile heads; predicts the 168h checkpoint and its spread.", "drift_prediction_model.joblib"],
    ["Module C — Reliability Index", "Weighted composition of predicted drift and uncertainty into a 0–100 index + Space-Safe / Borderline / High-Risk tier.", "composed at inference"],
  ].map(([name, desc, art]) => `
    <div class="box" style="margin:0;">
      <div class="box-title">${name}</div>
      <p class="box-sub" style="margin:0 0 10px;">${desc}</p>
      <span class="badge neutral">${art}</span>
    </div>`).join("");

  async function drawForecast(id) {
    const cid = (id || "C104").toUpperCase();
    const trajRes = await window.ASTRAGuardAPI.getComponentTrajectory(cid);
    if (trajRes.ok && trajRes.data && Array.isArray(trajRes.data.actual) && trajRes.data.actual.length > 0) {
      const liveTraj = trajRes.data;
      const actualPts = liveTraj.actual.map((p) => ({ x: p.time, y: p.value, forecast: false }));
      const predPts = (liveTraj.predicted || []).map((p) => ({ x: p.time, y: p.value, forecast: true }));
      charts.lineChart(document.getElementById("fc"), [
        { points: [...actualPts, ...predPts], color: COLORS.reject },
      ], { height: 220, xTick: (x) => `${x}h` });
      return;
    }

    const c = data.compById(cid) || data.topRisk(1)[0];
    const m = c.measurements;
    charts.lineChart(document.getElementById("fc"), [
      { points: m.hours.map((h, i) => ({ x: h, y: m.leakage[i], forecast: i >= m.predictedFrom })), color: COLORS.reject },
    ], { height: 220, xTick: (x) => `${x}h` });
  }
  document.getElementById("go").addEventListener("click", () => drawForecast(document.getElementById("cid").value || "C104"));
  drawForecast("C104");
</script>
</body>
</html>
