<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reports — SAGE</title>
<link rel="icon" href="../assets/brand/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared.css" />
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="console">
    <div class="console-top" id="consoleTop"></div>

    <div class="grid-2">
      <section class="box">
        <h2 class="box-title">Generate Report</h2>
        <label class="ctl" style="margin-bottom:12px;">Report type
          <select class="select" id="rtype">
            <option value="component">Component report (info + measurements + prediction + risk + explanation)</option>
            <option value="lot">Lot summary report</option>
            <option value="alerts">High-risk alert digest</option>
          </select>
        </label>
        <div class="console-actions" id="subjectRow">
          <input class="input" id="subject" placeholder="Component ID e.g. C1739" style="min-width:220px;" />
          <button class="btn" id="gen">Generate</button>
        </div>
        <p class="box-sub" style="margin-top:12px;">Component reports assemble all five Member-2 tables for one part.</p>
      </section>

      <section class="box">
        <h2 class="box-title">Recent Reports</h2>
        <ul class="exp-list" id="recent"></ul>
      </section>
    </div>

    <section class="box">
      <h2 class="box-title">Preview</h2>
      <div class="report-preview" id="preview">Select a report type and press Generate.</div>
      <div class="console-actions" style="margin-top:14px;">
        <button class="btn ghost" id="copy">Copy</button>
        <button class="btn ghost" id="download">Download .txt</button>
      </div>
    </section>
  </main>
</div>

<script src="../api.js"></script>
<script src="../app.js"></script>
<script>
  const { data, topbar, renderSidebar, toast } = window.SAGE;

  renderSidebar("reports.html");
  topbar("Reports", null, null, `<span class="box-sub" style="margin:0;">GET /components/{id}/report — audit-ready output</span>`);

  let last = "";

  function buildComponentReport(id) {
    const c = data.compById(id.toUpperCase());
    if (!c) return null;
    const m = c.measurements;
    return [
      "ASTRA-GUARD INSPECTION REPORT — COMPONENT",
      "=".repeat(46),
      `Component ID       : ${c.id}`,
      `Lot / Type         : ${c.lotId} · ${c.type}`,
      "",
      "MEASUREMENTS",
      `  Leakage    (µA)   : ${m.leakage.join(" → ")}`,
      `  Resistance (Ω)    : ${m.resistance.join(" → ")}`,
      `  Vth        (V)    : ${m.vth.join(" → ")}`,
      "",
      "PREDICTION (168h)",
      `  Forecast leakage  : ${m.leakage[3]} µA (predicted)`,
      "",
      "RISK ASSESSMENT",
      `  Anomaly score     : ${c.anomaly}`,
      `  Drift score       : ${c.drift}`,
      `  Uncertainty       : ${c.uncertainty}`,
      `  Risk score        : ${c.risk}`,
      `  Decision          : ${c.decision} (confidence ${c.confidence})`,
      "",
      "EXPLANATION",
      ...c.explanations.map((e) => `  ⚠ ${e}`),
      "",
      `Reliability Index  : ${c.reliabilityIndex} — ${c.tier}`,
      "",
      `Generated by ASTRA-GUARD sage-1.0 · ${new Date().toISOString().slice(0, 16).replace("T", " ")}`,
    ].join("\n");
  }

  function buildLotReport(lotId) {
    const lot = data.lotById(lotId);
    if (!lot) return null;
    const comps = data.compsByLot(lotId);
    const avg = (comps.reduce((a, c) => a + c.risk, 0) / comps.length).toFixed(1);
    const worst = comps.reduce((a, c) => (c.risk > a.risk ? c : a), comps[0]);
    return [
      "ASTRA-GUARD INSPECTION REPORT — LOT SUMMARY",
      "=".repeat(46),
      `Lot                : ${lot.lotId} (${lot.type}, ${lot.temp}°C ${lot.tempLabel})`,
      `Components         : ${lot.size}`,
      "",
      "DECISION MIX",
      `  PASS             : ${lot.pass}`,
      `  MONITOR          : ${lot.monitor}`,
      `  HOLD             : ${lot.hold}`,
      `  REJECT           : ${lot.reject}`,
      "",
      `Average risk       : ${avg}`,
      `Worst component    : ${worst.id} (risk ${worst.risk}, ${worst.decision})`,
      "",
      `Generated by ASTRA-GUARD sage-1.0 · ${new Date().toISOString().slice(0, 16).replace("T", " ")}`,
    ].join("\n");
  }

  function buildAlertDigest() {
    const top = data.topRisk(10);
    return [
      "ASTRA-GUARD INSPECTION REPORT — HIGH-RISK DIGEST",
      "=".repeat(46),
      ...top.map((c, i) =>
        `${String(i + 1).padStart(2)}. ${c.id}  risk ${String(c.risk).padEnd(5)} ${c.decision.padEnd(7)} ${c.lotId}  — ${data.reason(c)}`),
      "",
      `Generated by ASTRA-GUARD sage-1.0 · ${new Date().toISOString().slice(0, 16).replace("T", " ")}`,
    ].join("\n");
  }

  const typeSel = document.getElementById("rtype");
  const subject = document.getElementById("subject");

  function syncSubject() {
    subject.style.display = typeSel.value === "alerts" ? "none" : "";
    subject.placeholder = typeSel.value === "lot" ? "Lot ID e.g. LOT_27 or LOT-03" : "Component ID e.g. C104 or C1739";
  }
  typeSel.addEventListener("change", syncSubject);
  syncSubject();

  const recent = [];

  document.getElementById("gen").addEventListener("click", async () => {
    let text = null;
    const val = (subject.value || "").trim();

    if (typeSel.value === "component") {
      const cid = (val || "C104").toUpperCase();
      const res = await window.ASTRAGuardAPI.getComponentReport(cid);
      if (res.ok && res.data) {
        const r = res.data;
        const reasonsList = (r.reasons && r.reasons.length)
          ? r.reasons.map((e) => `  ⚠ ${e}`).join("\n")
          : "  ⚠ All parameters nominal within lot envelope";
        text = [
          "ASTRA-GUARD INSPECTION REPORT — COMPONENT",
          "=".repeat(46),
          `Component ID       : ${r.component_id}`,
          `Lot                : ${r.lot_id}`,
          `Model Version      : ${r.model_version || "sage-1.1"}`,
          "",
          "RISK & SCREENING ASSESSMENT",
          `  Risk Score       : ${r.risk_score}`,
          `  Decision         : ${r.decision} (confidence: ${r.confidence})`,
          `  Reliability Tier : ${r.reliability_tier || (r.risk_score >= 65 ? "High-Risk" : "Borderline")}`,
          `  Slope Reject Flag: ${r.slope_reject_flag ? "TRUE (flagged for early rejection)" : "FALSE"}`,
          `  Anomaly Score    : ${r.anomaly_score}`,
          `  Drift Risk       : ${r.drift_risk}`,
          `  Predicted 168h   : ${r.predicted_168h} µA`,
          "",
          "EXPLANATIONS & SHAP ATTRIBUTIONS",
          reasonsList,
          "",
          `Generated by ASTRA-GUARD ${r.model_version || "sage-1.1"} · ${new Date().toISOString().slice(0, 16).replace("T", " ")}`,
        ].join("\n");
      } else {
        text = buildComponentReport(cid);
      }
    }

    if (typeSel.value === "lot") {
      const lid = (val || "LOT_27").toUpperCase();
      const res = await window.ASTRAGuardAPI.getLotSummary(lid);
      if (res.ok && res.data) {
        const s = res.data;
        text = [
          "ASTRA-GUARD INSPECTION REPORT — LOT SUMMARY",
          "=".repeat(46),
          `Lot ID             : ${s.lot_id}`,
          `Total Components   : ${s.total_components}`,
          `High-Risk Count    : ${s.high_risk_components}`,
          `Avg Anomaly Score  : ${s.average_anomaly_score}`,
          "",
          "DECISION BREAKDOWN",
          `  PASS             : ${s.passed}`,
          `  MONITOR          : ${s.monitor}`,
          `  HOLD             : ${s.hold}`,
          `  REJECT           : ${s.reject}`,
          "",
          `Generated by ASTRA-GUARD · ${new Date().toISOString().slice(0, 16).replace("T", " ")}`,
        ].join("\n");
      } else {
        text = buildLotReport(lid);
      }
    }

    if (typeSel.value === "alerts") {
      const res = await window.ASTRAGuardAPI.getAlerts();
      if (res.ok && Array.isArray(res.data) && res.data.length > 0) {
        text = [
          "ASTRA-GUARD INSPECTION REPORT — HIGH-RISK DIGEST",
          "=".repeat(46),
          ...res.data.map((a, i) =>
            `${String(i + 1).padStart(2)}. ${a.component_id.padEnd(6)}  Lot: ${a.lot_id.padEnd(8)} Risk: ${String(a.risk_score).padEnd(6)} Severity: ${a.severity}`
          ),
          "",
          `Generated by ASTRA-GUARD · ${new Date().toISOString().slice(0, 16).replace("T", " ")}`,
        ].join("\n");
      } else {
        text = buildAlertDigest();
      }
    }

    if (!text) { toast("Unknown ID — try C104 or LOT_27"); return; }
    last = text;
    document.getElementById("preview").textContent = text;
    recent.unshift(text.split("\n")[0] + ` — ${new Date().toLocaleTimeString()}`);
    document.getElementById("recent").innerHTML =
      recent.slice(0, 6).map((r) => `<li class="ok">${r}</li>`).join("");
    toast("Report generated");
  });

  document.getElementById("copy").addEventListener("click", async () => {
    if (!last) return toast("Generate a report first");
    await navigator.clipboard.writeText(last).catch(() => {});
    toast("Copied to clipboard");
  });
  document.getElementById("download").addEventListener("click", () => {
    if (!last) return toast("Generate a report first");
    const blob = new Blob([last], { type: "text/plain" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "astraguard-report.txt";
    a.click();
    URL.revokeObjectURL(a.href);
    toast("Downloaded");
  });

  // Seed with flagship component report
  (async function initSeed() {
    const res = await window.ASTRAGuardAPI.getComponentReport("C104");
    if (res.ok && res.data) {
      const r = res.data;
      const reasonsList = (r.reasons && r.reasons.length)
        ? r.reasons.map((e) => `  ⚠ ${e}`).join("\n")
        : "  ⚠ All parameters nominal within lot envelope";
      const text = [
        "ASTRA-GUARD INSPECTION REPORT — COMPONENT",
        "=".repeat(46),
        `Component ID       : ${r.component_id}`,
        `Lot                : ${r.lot_id}`,
        `Model Version      : ${r.model_version || "sage-1.1"}`,
        "",
        "RISK & SCREENING ASSESSMENT",
        `  Risk Score       : ${r.risk_score}`,
        `  Decision         : ${r.decision} (confidence: ${r.confidence})`,
        `  Reliability Tier : ${r.reliability_tier || (r.risk_score >= 65 ? "High-Risk" : "Borderline")}`,
        `  Slope Reject Flag: ${r.slope_reject_flag ? "TRUE (flagged for early rejection)" : "FALSE"}`,
        `  Anomaly Score    : ${r.anomaly_score}`,
        `  Drift Risk       : ${r.drift_risk}`,
        `  Predicted 168h   : ${r.predicted_168h} µA`,
        "",
        "EXPLANATIONS & SHAP ATTRIBUTIONS",
        reasonsList,
        "",
        `Generated by ASTRA-GUARD ${r.model_version || "sage-1.1"} · ${new Date().toISOString().slice(0, 16).replace("T", " ")}`,
      ].join("\n");
      document.getElementById("preview").textContent = text;
      last = text;
    } else {
      document.getElementById("preview").textContent = buildComponentReport("C1739");
      last = document.getElementById("preview").textContent;
    }
  })();
</script>
</body>
</html>
