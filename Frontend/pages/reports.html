<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Engineering Reports — SAGE</title>
<link rel="icon" href="../assets/brand/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared.css" />
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="console">
    <div class="console-top" id="consoleTop"></div>

    <div class="grid-2">
      <section class="box">
        <h2 class="box-title">Generate Report</h2>
        <label class="ctl" style="margin-bottom:12px;">Report type
          <select class="select" id="rtype">
            <option value="component">Component Report (Full ML Screening, Forecast & Explanations)</option>
            <option value="lot">Lot Summary Report</option>
            <option value="alerts">High-Risk Alert Digest</option>
          </select>
        </label>
        <div class="console-actions" id="subjectRow">
          <input class="input" id="subject" placeholder="Component ID e.g. C504" style="min-width:220px;" />
          <button class="btn" id="gen">Generate</button>
        </div>
        <p class="box-sub" style="margin-top:12px;">Component reports query live Member 2 tables (predictions, risk assessments, and feature explanations).</p>
      </section>

      <section class="box">
        <h2 class="box-title">Recent Reports</h2>
        <ul class="exp-list" id="recent"></ul>
      </section>
    </div>

    <section class="box">
      <h2 class="box-title">Report Inspection Preview</h2>
      <div id="reportSummary" style="display:none;margin-bottom:16px;"></div>
      <div class="report-preview" id="preview" style="white-space:pre-wrap;line-height:1.5;">Select a report type and press Generate.</div>
      <div class="console-actions" style="margin-top:14px;">
        <button class="btn ghost" id="copy">Copy Text</button>
        <button class="btn ghost" id="download">Download .txt</button>
        <button class="btn ghost" id="print" onclick="window.print()">Print Report</button>
      </div>
    </section>
  </main>
</div>

<script src="../api.js"></script>
<script src="../app.js"></script>
<script>
  const { topbar, renderSidebar, toast, param, dotFor, badge } = window.SAGE;

  renderSidebar("reports.html");
  topbar("Reports", null, null, `<span class="box-sub" style="margin:0;">GET /api/components/{id}/report — audit-ready qualification output</span>`);

  let last = "";

  function fmt(val, digits = 1) {
    if (val == null || isNaN(val)) return "—";
    return Number(val).toFixed(digits);
  }

  function fmtPct(val) {
    if (val == null || isNaN(val)) return "—";
    const num = Number(val);
    return num <= 1.0 ? `${(num * 100).toFixed(0)}%` : `${num.toFixed(0)}%`;
  }

  function escapeHtml(str) {
    if (!str) return "";
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  const typeSel = document.getElementById("rtype");
  const subject = document.getElementById("subject");
  const summaryEl = document.getElementById("reportSummary");

  function syncSubject() {
    subject.style.display = typeSel.value === "alerts" ? "none" : "";
    subject.placeholder = typeSel.value === "lot"
      ? "Lot ID e.g. ISRO-SCL-250113-02"
      : "Component ID e.g. C504 or C501";
  }
  typeSel.addEventListener("change", syncSubject);
  syncSubject();

  const recent = [];

  function recordRecent(title) {
    recent.unshift(`${title} — ${new Date().toLocaleTimeString()}`);
    document.getElementById("recent").innerHTML =
      recent.slice(0, 6).map((r) => `<li class="ok">${escapeHtml(r)}</li>`).join("");
  }

  async function generateComponentReport(cid) {
    summaryEl.style.display = "none";
    document.getElementById("preview").textContent = `Fetching audit report for ${cid} from FastAPI backend...`;

    let res, compRes;
    try {
      [res, compRes] = await Promise.all([
        window.SAGEAPI.getComponentReport(cid),
        window.SAGEAPI.getComponent(cid),
      ]);
    } catch (err) {
      const errText = [
        "SAGE INSPECTION REPORT — ERROR",
        "=".repeat(60),
        "STATUS: BACKEND CONNECTION FAILED",
        "",
        `Unable to reach FastAPI backend at ${window.SAGEAPI.getBaseUrl()}.`,
        "Please ensure the backend server is running on port 8000.",
        "=".repeat(60),
      ].join("\n");
      document.getElementById("preview").textContent = errText;
      toast("Connection failed");
      return;
    }

    if (!res.ok) {
      if (res.status === 404) {
        const notFoundText = [
          "SAGE INSPECTION REPORT — ERROR",
          "=".repeat(60),
          "STATUS: 404 NOT FOUND",
          "",
          `Component "${cid}" was not found in the screening database.`,
          "No fake or synthesized report will be generated.",
          "",
          "Verified real database components include:",
          "  • C504 (Lot: ISRO-SCL-250113-02, Decision: HOLD)",
          "  • C501 (Lot: ISRO-SCL-250421-16, Decision: PASS)",
          "  • C519, C502, C503, C505, C507, C511, C514, C515, C517, C520, C525",
          "=".repeat(60),
        ].join("\n");
        document.getElementById("preview").textContent = notFoundText;
        last = notFoundText;
        toast(`Component ${cid} not found`);
      } else {
        const errText = [
          "SAGE INSPECTION REPORT — ERROR",
          "=".repeat(60),
          `STATUS: HTTP ${res.status}`,
          "",
          `Server error: ${res.error || "Unknown error"}`,
          "=".repeat(60),
        ].join("\n");
        document.getElementById("preview").textContent = errText;
        last = errText;
        toast("Server error");
      }
      return;
    }

    const r = res.data;
    const comp = (compRes.ok && compRes.data) ? compRes.data : {};

    // Harmonized data
    const split = comp.split || r.split || "train";
    const status = comp.status || r.status || "SCREENED";
    const modelVer = r.model_version || comp.model_version || "sage-1.1";
    const riskScore = r.risk_score != null ? r.risk_score : comp.risk_score;
    const riskLevel = comp.risk_level || (riskScore >= 80 ? "CRITICAL" : riskScore >= 60 ? "HIGH" : riskScore >= 30 ? "MEDIUM" : "LOW");
    const decision = r.decision || comp.decision || "—";
    const conf = r.confidence ?? comp.confidence;
    const tier = r.reliability_tier || comp.reliability_tier || "Borderline";
    const relIndex = r.reliability_index ?? comp.reliability_index;
    const slopeReject = Boolean(r.slope_reject_flag ?? comp.slope_reject_flag);
    const driftScore = r.drift_score ?? comp.drift_score;
    const predDrift = r.predicted_drift_score;
    const pred168 = r.predicted_168h ?? comp.predicted_168h;
    const unc = r.uncertainty_score;
    const intLow = r.interval_low;
    const intHigh = r.interval_high;
    const intervalStr = (intLow != null && intHigh != null) ? `${fmt(intLow, 4)} — ${fmt(intHigh, 4)}` : "—";

    // Format structured explanations
    let explanationsBlock = "";
    if (r.explanations && Array.isArray(r.explanations) && r.explanations.length > 0) {
      explanationsBlock = r.explanations.map((exp, i) => {
        const contribStr = exp.contribution != null ? (exp.contribution > 0 ? `+${exp.contribution}` : `${exp.contribution}`) : "";
        return `  ${i + 1}. [Feature: ${exp.feature}] ${contribStr ? `(Contribution: ${contribStr}) ` : ""}— ${exp.reason}`;
      }).join("\n");
    } else {
      explanationsBlock = "  • No structured explanation items available.";
    }

    // Summary reasons
    let reasonsBlock = "";
    if (r.reasons && Array.isArray(r.reasons) && r.reasons.length > 0) {
      reasonsBlock = r.reasons.map((item) => `  ⚠ ${item}`).join("\n");
    } else {
      reasonsBlock = "  ✓ All measurements nominal within lot envelope.";
    }

    // Measurement summary table if available
    let measTableBlock = "";
    if (r.measurement_summary && typeof r.measurement_summary === "object") {
      measTableBlock = [
        "",
        "OBSERVED PARAMETER DRIFT SUMMARY (0h → 168h)",
        "-".repeat(68),
        `  Parameter         Initial       Latest        Min / Max          Drift %`,
        "-".repeat(68),
        ...Object.entries(r.measurement_summary).map(([param, m]) => {
          const pName = param.padEnd(16);
          const first = (m.first != null ? fmt(m.first, 3) : "—").padEnd(14);
          const last = (m.last != null ? fmt(m.last, 3) : "—").padEnd(14);
          const minMax = `${m.min != null ? fmt(m.min, 2) : "—"} / ${m.max != null ? fmt(m.max, 2) : "—"}`.padEnd(19);
          const driftPct = m.drift_pct != null ? `${m.drift_pct > 0 ? '+' : ''}${fmt(m.drift_pct, 1)}%` : "—";
          return `  ${pName}${first}${last}${minMax}${driftPct}`;
        }),
      ].join("\n");
    }

    const text = [
      "====================================================================",
      "SAGE COMPONENT SCREENING & QUALIFICATION REPORT",
      "====================================================================",
      `Report ID          : RPT-${r.component_id}-${Date.now().toString(36).toUpperCase()}`,
      `Timestamp          : ${new Date().toISOString().replace("T", " ").slice(0, 19)} UTC`,
      `Facility           : Semi-Conductor Laboratory (SCL), ISRO`,
      `Inspection System  : SAGE ML Inference Core (${modelVer})`,
      "",
      "1. COMPONENT IDENTIFICATION",
      "-".repeat(68),
      `  Component ID     : ${r.component_id}`,
      `  Lot Identifier   : ${r.lot_id}`,
      `  Component Type   : ${r.component_type || "MOSFET / Power Semiconductor"}`,
      `  Screening Status : ${status}`,
      `  Dataset Split    : ${split}`,
      `  Model Version    : ${modelVer}`,
      "",
      "2. SCREENING DECISION & RISK ASSESSMENT",
      "-".repeat(68),
      `  Screening Action : ${decision}`,
      `  Model Confidence : ${fmtPct(conf)} (${fmt(conf, 3)})`,
      `  Total Risk Score : ${fmt(riskScore)} / 100`,
      `  Risk Category    : ${riskLevel}`,
      `  Reliability Tier : ${tier}`,
      `  Slope Reject Flag: ${slopeReject ? "FLAGGED (predicted drift rate exceeds safety threshold)" : "PASS (within Safe population envelope)"}`,
      `  Anomaly Score    : ${fmt(r.anomaly_score)} / 100`,
      "",
      "3. PARAMETER DRIFT & 168h DEGRADATION FORECAST",
      "-".repeat(68),
      `  Current Drift    : ${fmt(driftScore)} / 100 (measured early drift)`,
      `  Predicted Drift  : ${fmt(predDrift, 2)} (projected drift at 168h)`,
      `  Drift Risk Level : ${r.drift_risk || "—"}`,
      `  168h Forecast    : ${fmt(pred168, 4)}`,
      `  Prediction Range : ${intervalStr}`,
      `  Uncertainty Score: ${fmt(unc)} / 100 (conformal interval width)`,
      measTableBlock,
      "",
      "4. MULTI-PARAMETER RISK EVIDENCE",
      "-".repeat(68),
      `  Lot-Relative Outlier Score : ${fmt(r.lot_relative_score)} (intra-lot z-distribution)`,
      `  Multivariate Anomaly Score : ${fmt(r.multivariate_score)} (cross-parameter isolation)`,
      `  Worst Parameter Z-Score    : ${fmt(r.worst_lot_zscore, 2)} (relative to lot baseline)`,
      `  Absolute Spec Violation    : ${r.absolute_spec_fail === 1 ? "VIOLATION (1) — Datasheet limit exceeded" : "No violation detected (0)"}`,
      "",
      "5. SPACE RELIABILITY EVALUATION",
      "-".repeat(68),
      `  Space Reliability Index    : ${fmt(relIndex)} / 100`,
      `  Qualification Tier         : ${tier}`,
      "",
      "6. MODEL EXPLAINABILITY & FEATURE CONTRIBUTIONS",
      "-".repeat(68),
      explanationsBlock,
      "",
      "7. DIAGNOSTIC REASONS",
      "-".repeat(68),
      reasonsBlock,
      "",
      "====================================================================",
      "AUTHENTIC VERIFICATION: Generated from real FastAPI backend and database records.",
      "====================================================================",
    ].join("\n");

    document.getElementById("preview").textContent = text;
    last = text;

    // Render Executive Visual Summary Bar
    const decClass = decision.toLowerCase();
    const tierClass = tier === "Space-Safe" ? "safe" : tier === "High-Risk" ? "reject" : "monitor";

    summaryEl.style.display = "block";
    summaryEl.innerHTML = `
      <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--panel-solid);border:1px solid var(--line-strong);border-radius:12px;">
        <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;">
          <span style="font-family:var(--mono);font-size:13px;font-weight:600;color:var(--signal);">${escapeHtml(r.component_id)}</span>
          <a class="backlink" href="lot-detail.html?lot=${encodeURIComponent(r.lot_id)}" style="font-size:11px;padding:3px 8px;">Lot: ${escapeHtml(r.lot_id)}</a>
          <span class="badge ${decClass}">${escapeHtml(decision)}</span>
          <span class="badge ${tierClass}">${escapeHtml(tier)}</span>
          <span class="badge neutral">Risk: ${fmt(riskScore)}</span>
          <span class="badge neutral">Drift: ${fmt(driftScore)}</span>
          <span class="badge neutral">Pred 168h: ${fmt(pred168, 3)}</span>
          <span class="badge neutral">Rel: ${fmt(relIndex)}</span>
        </div>
        <div>
          <a class="btn ghost" href="component-detail.html?comp=${encodeURIComponent(r.component_id)}" style="font-size:11px;padding:5px 12px;text-decoration:none;">
            Detailed Telemetry Analysis →
          </a>
        </div>
      </div>
    `;

    recordRecent(`Component ${r.component_id} (${decision})`);
    toast(`Report generated for ${r.component_id}`);
  }

  async function generateLotReport(lid) {
    summaryEl.style.display = "none";
    document.getElementById("preview").textContent = `Fetching lot summary for ${lid}...`;

    let res;
    try {
      res = await window.SAGEAPI.getLotSummary(lid);
    } catch (err) {
      document.getElementById("preview").textContent = `Error: Unable to reach backend at ${window.SAGEAPI.getBaseUrl()}`;
      toast("Connection failed");
      return;
    }

    if (!res.ok) {
      const errText = [
        "SAGE LOT INSPECTION REPORT — ERROR",
        "=".repeat(60),
        `STATUS: ${res.status === 404 ? '404 NOT FOUND' : 'ERROR'}`,
        "",
        `Lot "${lid}" was not found in the database.`,
        "Verified real database lots include: ISRO-SCL-250113-02, ISRO-SCL-250421-16, etc.",
        "=".repeat(60),
      ].join("\n");
      document.getElementById("preview").textContent = errText;
      last = errText;
      toast(`Lot ${lid} not found`);
      return;
    }

    const s = res.data;
    const text = [
      "====================================================================",
      "SAGE LOT QUALIFICATION SUMMARY REPORT",
      "====================================================================",
      `Lot Identifier     : ${s.lot_id}`,
      `Generated At       : ${new Date().toISOString().replace("T", " ").slice(0, 19)} UTC`,
      `Facility           : Semi-Conductor Laboratory (SCL), ISRO`,
      "",
      "1. LOT POPULATION METRICS",
      "-".repeat(68),
      `  Total Components : ${s.total_components}`,
      `  Average Anomaly  : ${fmt(s.average_anomaly_score)}`,
      `  High-Risk Count  : ${s.high_risk_components}`,
      "",
      "2. SCREENING DECISION BREAKDOWN",
      "-".repeat(68),
      `  PASS             : ${s.passed}`,
      `  MONITOR          : ${s.monitor}`,
      `  HOLD             : ${s.hold}`,
      `  REJECT           : ${s.reject}`,
      "",
      "====================================================================",
      "Source: GET /api/lots/{lot_id}/summary",
      "====================================================================",
    ].join("\n");

    document.getElementById("preview").textContent = text;
    last = text;
    recordRecent(`Lot Summary ${s.lot_id}`);
    toast(`Lot summary generated for ${s.lot_id}`);
  }

  async function generateAlertsDigest() {
    summaryEl.style.display = "none";
    document.getElementById("preview").textContent = "Fetching high-risk alert digest from database...";

    let res;
    try {
      res = await window.SAGEAPI.getAlerts();
    } catch (err) {
      document.getElementById("preview").textContent = `Error: Unable to reach backend at ${window.SAGEAPI.getBaseUrl()}`;
      toast("Connection failed");
      return;
    }

    if (!res.ok) {
      document.getElementById("preview").textContent = `Error fetching alerts: ${res.error}`;
      return;
    }

    const alerts = res.data || [];
    let text = "";
    if (alerts.length === 0) {
      text = [
        "====================================================================",
        "SAGE HIGH-RISK ALERT DIGEST",
        "====================================================================",
        `Timestamp          : ${new Date().toISOString().replace("T", " ").slice(0, 19)} UTC`,
        "",
        "STATUS: NO HIGH-RISK ALERTS",
        "All components in the current screening database are within normal risk thresholds.",
        "====================================================================",
      ].join("\n");
    } else {
      text = [
        "====================================================================",
        "SAGE HIGH-RISK ALERT DIGEST",
        "====================================================================",
        `Timestamp          : ${new Date().toISOString().replace("T", " ").slice(0, 19)} UTC`,
        `Active Alerts      : ${alerts.length} components requiring review`,
        "",
        "FLAGGED COMPONENTS (Risk Score >= 50.0 Threshold)",
        "-".repeat(68),
        `  #   Component   Lot Identifier     Risk Score   Severity`,
        "-".repeat(68),
        ...alerts.map((a, i) => {
          const num = String(i + 1).padStart(2);
          const cid = String(a.component_id).padEnd(12);
          const lid = String(a.lot_id).padEnd(19);
          const rScore = fmt(a.risk_score).padEnd(13);
          const sev = a.severity || "HIGH";
          return `  ${num}. ${cid}${lid}${rScore}${sev}`;
        }),
        "",
        "====================================================================",
        "Source: GET /api/alerts",
        "====================================================================",
      ].join("\n");
    }

    document.getElementById("preview").textContent = text;
    last = text;
    recordRecent(`Alert Digest (${alerts.length} flagged)`);
    toast("Alert digest generated");
  }

  document.getElementById("gen").addEventListener("click", () => {
    const val = (subject.value || "").trim();
    if (typeSel.value === "component") {
      const cid = (val || "C504").toUpperCase();
      generateComponentReport(cid);
    } else if (typeSel.value === "lot") {
      const lid = (val || "ISRO-SCL-250113-02").toUpperCase();
      generateLotReport(lid);
    } else if (typeSel.value === "alerts") {
      generateAlertsDigest();
    }
  });

  document.getElementById("copy").addEventListener("click", async () => {
    if (!last) return toast("Generate a report first");
    await navigator.clipboard.writeText(last).catch(() => {});
    toast("Copied to clipboard");
  });

  document.getElementById("download").addEventListener("click", () => {
    if (!last) return toast("Generate a report first");
    const blob = new Blob([last], { type: "text/plain" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `sage-report-${Date.now().toString(36)}.txt`;
    a.click();
    URL.revokeObjectURL(a.href);
    toast("Downloaded .txt report");
  });

  // Initial load: prioritize URL query parameter
  (function init() {
    const urlId = (param("comp") || param("id") || "").trim().toUpperCase();
    if (urlId) {
      subject.value = urlId;
      generateComponentReport(urlId);
    } else {
      subject.value = "C504"; // Flagship real database component
      generateComponentReport("C504");
    }
  })();
</script>
</body>
</html>
