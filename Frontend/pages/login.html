<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sign In — SAGE Console</title>
<link rel="icon" href="../assets/brand/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared.css" />
<style>
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    background: radial-gradient(circle at 50% 20%, rgba(20, 36, 60, 0.45), var(--bg));
  }
  .login-card {
    width: 100%;
    max-width: 420px;
    padding: 36px 32px;
    background: var(--panel-solid);
    border: 1px solid var(--line-strong);
    border-radius: 16px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(238, 243, 247, 0.06);
  }
  .login-header {
    text-align: center;
    margin-bottom: 28px;
  }
  .login-logo {
    height: 48px;
    width: auto;
    margin-bottom: 14px;
  }
  .login-title {
    font-family: var(--display);
    font-size: 22px;
    font-weight: 700;
    color: var(--frost);
    letter-spacing: 0.05em;
    margin: 0 0 6px;
  }
  .login-sub {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--steel);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin: 0;
    line-height: 1.4;
  }
  .form-group {
    margin-bottom: 18px;
  }
  .form-label {
    display: block;
    font-family: var(--mono);
    font-size: 11.5px;
    font-weight: 500;
    color: var(--steel);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 8px;
  }
  .form-input {
    width: 100%;
    box-sizing: border-box;
    padding: 12px 14px;
    background: rgba(13, 22, 36, 0.7);
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--frost);
    font-family: var(--sans);
    font-size: 14px;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .form-input:focus {
    outline: none;
    border-color: var(--sky);
    box-shadow: 0 0 0 3px rgba(143, 201, 250, 0.15);
  }
  .btn-submit {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    background: var(--sky);
    color: #070d18;
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: opacity 0.15s ease, transform 0.1s ease;
  }
  .btn-submit:hover:not(:disabled) {
    opacity: 0.92;
  }
  .btn-submit:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .error-box {
    display: none;
    padding: 10px 14px;
    margin-bottom: 18px;
    background: rgba(248, 113, 113, 0.12);
    border: 1px solid rgba(248, 113, 113, 0.35);
    border-radius: 8px;
    color: var(--reject);
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.4;
  }
  .login-footer {
    margin-top: 24px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    text-align: center;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--steel-dim);
  }
</style>
</head>
<body>
  <div class="login-card">
    <div class="login-header">
      <img src="../assets/brand/logo.png" alt="SAGE" class="login-logo" />
      <h1 class="login-title">SAGE</h1>
      <p class="login-sub">Semiconductor Burn-In &amp; Latent Defect Screening Console</p>
    </div>

    <div class="error-box" id="errorBox"></div>

    <form id="loginForm" autocomplete="on">
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input class="form-input" id="username" type="text" placeholder="Engineer Username" required autofocus autocomplete="username" />
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input class="form-input" id="password" type="password" placeholder="••••••••" required autocomplete="current-password" />
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">Sign In</button>
    </form>

    <div class="login-footer">
      <div>SAGE Authentication Core · JWT Bearer (sage-1.1)</div>
    </div>
  </div>

  <script src="../api.js"></script>
  <script>
    const form = document.getElementById("loginForm");
    const errorBox = document.getElementById("errorBox");
    const submitBtn = document.getElementById("submitBtn");

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.style.display = "block";
    }

    function clearError() {
      errorBox.textContent = "";
      errorBox.style.display = "none";
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearError();

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;

      if (!username || !password) {
        showError("Please enter both username and password.");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Authenticating…";

      try {
        const res = await window.SAGEAPI.login(username, password);
        if (res.ok) {
          const params = new URLSearchParams(location.search);
          const redirect = params.get("redirect") || "components.html";
          window.location.href = redirect;
        } else {
          showError(res.error || "Authentication failed. Invalid username or password.");
        }
      } catch (err) {
        showError("Network error. Could not connect to SAGE backend.");
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Sign In";
      }
    });
  </script>
</body>
</html>
