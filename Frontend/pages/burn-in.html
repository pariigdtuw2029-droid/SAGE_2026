<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Burn-In Testing — SAGE</title>
<link rel="icon" href="../assets/brand/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared.css" />
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="console">
    <div class="console-top" id="consoleTop"></div>

    <div class="kpi-row" id="kpis"></div>

    <section class="box">
      <h2 class="box-title">Lot Overview Table</h2>
      <p class="box-sub">Click a lot row to open its component grid</p>
      <div class="table-wrap">
        <table class="data" id="lotTable">
          <thead>
            <tr><th>Lot ID</th><th>Type</th><th>Components</th><th>Pass</th><th>Monitor</th><th>Hold</th><th>Reject</th><th>Temp</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <div class="grid-2">
      <section class="box">
        <h2 class="box-title">Risk Distribution</h2>
        <canvas class="chart" id="riskPie"></canvas>
        <div class="legend" id="riskLegend"></div>
      </section>
      <section class="box">
        <h2 class="box-title">Anomaly Scatter Plot</h2>
        <canvas class="chart" id="scatter"></canvas>
        <div class="legend">
          <span class="item"><span class="dot safe"></span> Space-Safe</span>
          <span class="item"><span class="dot monitor"></span> Borderline</span>
          <span class="item"><span class="dot reject"></span> High-Risk</span>
        </div>
      </section>
    </div>

    <section class="box">
      <h2 class="box-title">High-Risk Alerts (Top 10)</h2>
      <ul class="exp-list" id="alerts"></ul>
    </section>
  </main>
</div>

<script src="../app.js"></script>
<script>
  const { data, charts, topbar, renderSidebar, badge } = window.SAGE;

  renderSidebar("burn-in.html");
  topbar("Burn-In Testing", null, null, `<button class="btn" id="uploadBtn">[Upload CSV]</button>`);
  document.getElementById("uploadBtn").addEventListener("click", () =>
    window.SAGE.toast("CSV upload → POST /upload (Member 1's endpoint)"));

  const t = data.totals();
  document.getElementById("kpis").innerHTML = [
    ["Total Lots", t.lots],
    ["Components", t.comps.toLocaleString()],
    ["Rejected", t.reject],
    ["Model Used", "sage-1.0"],
  ].map(([l, v]) => `<div class="kpi"><div class="kpi-label">${l}</div><div class="kpi-value">${v}</div></div>`).join("");

  document.querySelector("#lotTable tbody").innerHTML = data.lots.map((l) => `
    <tr class="click" data-lot="${l.lotId}">
      <td>${l.lotId}</td><td>${l.type}</td><td>${l.size}</td>
      <td>${l.pass}</td><td>${l.monitor}</td><td>${l.hold}</td><td>${l.reject}</td>
      <td>${l.temp}°C</td>
    </tr>`).join("");
  document.querySelectorAll("#lotTable tr.click").forEach((tr) =>
    tr.addEventListener("click", () => location.href = `lot-detail.html?lot=${tr.dataset.lot}`));

  charts.donutChart(document.getElementById("riskPie"), [
    { value: t.pass,    color: window.SAGE.COLORS.safe },
    { value: t.monitor, color: window.SAGE.COLORS.monitor },
    { value: t.hold,    color: window.SAGE.COLORS.hold },
    { value: t.reject,  color: window.SAGE.COLORS.reject },
  ], { height: 200, center: t.comps.toLocaleString(), centerSub: "components" });

  document.getElementById("riskLegend").innerHTML = `
    <span class="item"><span class="dot safe"></span> Space-Safe ${Math.round(t.pass / t.comps * 100)}%</span>
    <span class="item"><span class="dot monitor"></span> Borderline ${Math.round((t.monitor + t.hold) / t.comps * 100)}%</span>
    <span class="item"><span class="dot reject"></span> High-Risk ${Math.round(t.reject / t.comps * 100)}%</span>`;

  charts.scatterChart(document.getElementById("scatter"),
    data.components.map((c) => ({
      x: c.drift, y: c.anomaly,
      color: c.decision === "PASS" ? window.SAGE.COLORS.safe
           : c.decision === "REJECT" ? window.SAGE.COLORS.reject
           : window.SAGE.COLORS.monitor,
    })),
    { height: 230, axisLabels: { x: "Drift Score", y: "Anomaly" } });

  document.getElementById("alerts").innerHTML = data.topRisk(10).map((c) => `
    <li class="click" style="cursor:pointer" data-c="${c.id}">
      <span class="dot reject"></span>
      <b>${c.id}</b> — Risk: ${c.risk} — ${c.decision} — ${data.reason(c)}
    </li>`).join("");
  document.querySelectorAll("#alerts li").forEach((li) =>
    li.addEventListener("click", () => location.href = `component-detail.html?comp=${li.dataset.c}`));
</script>
</body>
</html>
